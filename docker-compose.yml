services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: onboarding
      POSTGRES_DB: onboarding_hub
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://onboarding:onboarding@db:5432/onboarding_hub
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }

  # Daily sync at 08:00 Asia/Yerevan (CRON_SCHEDULE / CRON_TIMEZONE in .env)
  cron:
    build: .
    env_file: .env
    environment:
      APP_URL: http://app:3000
    command: ["npx", "tsx", "scripts/cron-worker.ts"]
    depends_on: [app]

volumes:
  pgdata:
